<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Day 25 - AI Web Integration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            padding: 24px;
            background: #111827;
            color: white;
            text-align: center;
        }

        main {
            width: min(1200px, 92%);
            margin: 30px auto;
            display: grid;
            gap: 24px;
        }

        section {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            font: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .ai-chatbot__messages {
            min-height: 180px;
            max-height: 350px;
            overflow-y: auto;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
        }

        .ai-chatbot__message {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .ai-chatbot__message--user {
            background: #dbeafe;
            text-align: right;
        }

        .ai-chatbot__message--assistant {
            background: #e5e7eb;
        }

        .ai-recommendations__list {
            display: grid;
            gap: 12px;
        }

        .ai-recommendation-card {
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .ai-recommendation-card__actions {
            display: flex;
            gap: 8px;
        }

        .ai-recommendation-card__actions button {
            margin: 0;
        }

        #analytics {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(180px, 1fr)
            );
            gap: 12px;
        }

        .metric {
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
            text-align: center;
        }

        .metric strong {
            display: block;
            font-size: 28px;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>AI Web Integration Demo</h1>
    <p>
        Chatbot, content generation,
        recommendations and analytics
    </p>
</header>

<main>

    <section>
        <div id="chatbot"></div>
    </section>

    <section>
        <div id="content-generator"></div>
    </section>

    <section>
        <div id="recommendations"></div>
    </section>

    <section>
        <h2>AI Analytics</h2>

        <div id="analytics">
            <div class="metric">
                Chat Messages
                <strong id="chat-count">0</strong>
            </div>

            <div class="metric">
                Content Generations
                <strong id="generation-count">0</strong>
            </div>

            <div class="metric">
                Recommendation Feedback
                <strong id="feedback-count">0</strong>
            </div>
        </div>
    </section>

</main>

<script src="../ai/web-components/ai-chatbot.js"></script>
<script src="../ai/web-components/ai-content-generator.js"></script>
<script src="../ai/web-components/ai-recommendations.js"></script>

<script>
    const chatbotContainer =
        document.getElementById("chatbot");

    const generatorContainer =
        document.getElementById("content-generator");

    const recommendationsContainer =
        document.getElementById("recommendations");

    const chatbot =
        new AIChatbot(chatbotContainer);

    const contentGenerator =
        new AIContentGenerator(generatorContainer);

    const recommendations =
        new AIRecommendations(
            recommendationsContainer,
            {
                profile: {
                    interests: [
                        "Web Development",
                        "Artificial Intelligence"
                    ],
                    skills: [
                        "JavaScript",
                        "React"
                    ]
                }
            }
        );

    const analytics = {
        chatMessages: 0,
        generations: 0,
        feedback: 0
    };

    function updateAnalytics() {
        document.getElementById("chat-count")
            .textContent = analytics.chatMessages;

        document.getElementById("generation-count")
            .textContent = analytics.generations;

        document.getElementById("feedback-count")
            .textContent = analytics.feedback;
    }

    updateAnalytics();

    const originalSendMessage =
        chatbot.sendMessage.bind(chatbot);

    chatbot.sendMessage = async function () {
        analytics.chatMessages += 1;
        updateAnalytics();

        return originalSendMessage();
    };

    const originalGenerateContent =
        contentGenerator.generateContent
            .bind(contentGenerator);

    contentGenerator.generateContent =
        async function (requestData = null) {
            analytics.generations += 1;
            updateAnalytics();

            return originalGenerateContent(
                requestData
            );
        };

    const originalFeedback =
        recommendations.handleFeedback
            .bind(recommendations);

    recommendations.handleFeedback =
        async function (index, feedback) {
            analytics.feedback += 1;
            updateAnalytics();

            return originalFeedback(
                index,
                feedback
            );
        };
</script>

</body>
</html>
